run:
  name: 20260827_TSRAG_retrieval_ablation_offline
  seed: 2021
  max_wall_time_seconds: 259200
  monitor_interval_seconds: 1800

model:
  context_length: 512
  prediction_length: 64
  top_k: 10
  augment_mode: moe
  mixer_variant: official
  frozen_backbone: true

optimizer:
  name: adamw
  learning_rate: 0.00003
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: cosine_annealing
  scheduler_tmax: 20

data:
  schedule_rows: 2560000
  retrieval_rows: 2792864
  shuffle_buffer_length: 10000
  retrieval_shards: 64
  ann_nlist: 16384
  ann_training_rows: 1000000
  ann_minimum_recall: 0.95

execution:
  devices: [0]
  global_batch_size: 256
  gradient_accumulation_steps: 1
  optimizer_updates: 10000
  log_every: 100
  checkpoint_updates: [1000, 5000]
  official_checkpoint_semantics: pre_update_10000_equals_9999_updates

acceptance:
  previous_k10_average_mse: 0.1976023593094361
  previous_k10_average_mae: 0.2509400402
  k10_absolute_tolerance: 0.005
