benchmark:
  datasets: [ETTh1, ETTh2, ETTm1, ETTm2, weather, electricity, exchange_rate]
  context_length: 512
  prediction_length: 64
  top_k: 10
  retrieval_mode: only_self_train
  augment_mode: moe
  metrics: [mse, mae]
  training_allowed: false

paths:
  data_root: ../Data
  base_model: ../Data/chronos-bolt-base
  tsrag_checkpoint: ../Data/TS-RAG-ChronosBolt/pytorch_model.bin
  retrieved_datasets: ../Data/TS-RAG-Data/datasets_512
  retrieval_databases: ../Data/TS-RAG-Data/database_512
  baseline_views: ../artifacts/baseline_raw_v1

execution:
  initial_batch_size: 256
  batch_size_fallbacks: [128, 64, 32, 16, 8, 4, 1]
  num_workers: 4
  gpu_0: [ETTh1, ETTm1, weather, electricity]
  gpu_1: [ETTh2, ETTm2, exchange_rate]

