run:
  name: 20260817_TSRAG_ARM_official10k_mse-mae
  seed: 2021
  max_wall_time_seconds: 21600
  monitor_interval_seconds: 600

model:
  context_length: 512
  prediction_length: 64
  top_k: 10
  augment_mode: moe
  frozen_backbone: true
  trainable_modules: [encode_mlp, mha, ffn, gate_layer]
  expected_total_parameters: 210068353
  expected_trainable_parameters: 4775425

optimizer:
  name: adamw
  learning_rate: 0.00003
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: cosine_annealing
  scheduler_tmax: 20

data:
  drop_prob: 0.0
  shuffle_buffer_length: 10000
  retrieval_rows: 2792864
  training_rows: 28013980

execution:
  devices: [0, 1]
  global_batch_size: 256
  gradient_accumulation_steps: 1
  optimizer_updates: 10000
  log_every: 100
  checkpoint_updates: [1000, 5000]
  official_checkpoint_semantics: pre_update_10000_equals_9999_updates

acceptance:
  paper_average_mse: 0.1940
  paper_average_mae: 0.2492
  per_dataset_absolute_tolerance: 0.005
